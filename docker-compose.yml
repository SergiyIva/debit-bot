services:
  credit-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Belt-and-suspenders: surface PROXY_URL as the conventional
      # HTTP(S)_PROXY env vars so that any HTTP client in the process
      # (Bun's fetch, googleapis, undici) honours it without explicit wiring.
      HTTPS_PROXY: ${PROXY_URL}
      HTTP_PROXY: ${PROXY_URL}
      NO_PROXY: localhost,127.0.0.1
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
