services:
  credit-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # HTTPS_PROXY/HTTP_PROXY are NOT set here — PROXY_URL may be a JSON
    # array which docker-compose's ${VAR} interpolation cannot expand.
    # Normalisation (array → first URL) happens in src/proxy/bootstrap.ts.
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
